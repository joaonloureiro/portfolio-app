name: Publish v1 container images

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/publish-v1-container-images.yml"
  workflow_dispatch:

concurrency:
  group: publish-v1-container-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/JoaoLoureiro.Portfolio.Api/Dockerfile
            image: portfolio-app-backend
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: portfolio-app-frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_GITHUB_URL=${{ vars.NEXT_PUBLIC_GITHUB_URL }}
            NEXT_PUBLIC_LINKEDIN_URL=${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  pin-v1:
    name: Pin the first successful build as v1
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the immutable v1 source tag once
        id: stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if gh api "repos/${REPOSITORY}/git/ref/tags/v1" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "The v1 source tag already exists; it will not move."
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f ref="refs/tags/v1" \
              -f sha="${COMMIT_SHA}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Point v1 image tags at the first successful build
        if: steps.stable.outputs.created == 'true'
        env:
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAMESPACE}/portfolio-app-backend:v1" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/portfolio-app-backend:sha-${COMMIT_SHA}"

          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAMESPACE}/portfolio-app-frontend:v1" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/portfolio-app-frontend:sha-${COMMIT_SHA}"
